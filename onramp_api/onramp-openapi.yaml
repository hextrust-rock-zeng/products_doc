openapi: 3.0.3
info:
  title: Hex Trust — On-Ramp Trading API
  version: "1.2"
  description: |
    > **Changelog v1.2 (2026-08-14):** `PARTIAL_FIAT_RECEIVED` removed from the
    > state machine, webhook events, and examples — partial fiat settlements
    > cannot be recorded in the current operational flow (settlement amount
    > must match the order amount exactly). `FAILED` remains documented but is
    > not yet triggered by any automated path.
    >
    > **Changelog v1.1 (2026-08-14, aligned to implementation):**
    > `clientOrderId` removed everywhere (request, responses, webhooks) —
    > replaced by optional `clientUserId` on `acceptQuote`; optional
    > `settlementAddress` per-order destination override on `acceptQuote`;
    > `availablePairs` gains fiat/crypto min-max limits (JSON numbers,
    > advisory) and `fiatCurrency`/`cryptoCurrency` query filters; error
    > envelope documented as implemented (numeric codes, incl. -32045/-32046);
    > webhook `data.order` gains best-effort `clientName`/`enterpriseName`/
    > `hexBrokerEntityName`; LP is routed per broker entity (openFX/Binance/
    > Ripple); `TRADE_EXECUTED` fires back-to-back with `FIAT_RECEIVED`.

    On-Ramp allows institutional clients to acquire stablecoins (USDC, USDT) by
    paying fiat. Hex Trust quotes a rate from a liquidity provider (routed per
    broker entity — openFX, Binance, or Ripple), settles the trade from internal
    inventory, and delivers stablecoin on-chain to the client's whitelisted
    wallet — the pre-configured default for the chain, or a per-order
    `settlementAddress` override supplied on `acceptQuote`.

    ## Authentication
    Every request requires both:
    - `Authorization: Bearer <signed-JWT>` — signed with the client's private key
    - `X-API-KEY` — the client's API key ID

    ## Flow (DvP-atomic)
    The on-ramp follows a Delivery-versus-Payment atomic flow — Hex Trust will
    not deliver crypto until ops manually confirms the client's fiat wire (CL1):

    1. `GET /onramp/availablePairs` — discover supported (fiat → stablecoin) pairs
    2. `POST /onramp/getQuote` — get a live indicative quote; valid until
       `validTimestamp` (LP-driven; may be extended by client spread config)
    3. `POST /onramp/acceptQuote` — bind the quote → receive **Hex Trust's shared
       bank account details** + an `orderId`; the order has a configurable
       fulfilment window (default 48h)
    4. Client wires fiat to the returned bank account (no per-order reference
       required in the wire memo — ops matches by amount + originating bank +
       timing)
    5. Ops manually confirms CL1 in HexAdmin → `FIAT_RECEIVED` webhook fires
    6. The trade is booked at the locked rate immediately after the CL1
       confirm → `TRADE_EXECUTED` webhook fires back-to-back with
       `FIAT_RECEIVED` (expect the two in immediate succession)
    7. HexSafe custody delivers the stablecoin on-chain to the client's
       pre-configured whitelisted destination address (HexSafe vault or external
       wallet) → `TRADE_SETTLED` webhook fires (terminal)

    ## Order State Machine
    ```
    ORDER_CREATED
      ├─→ FIAT_RECEIVED          (full wire within window)
      └─→ ORDER_EXPIRED          (window expires without full fiat)
    FIAT_RECEIVED
      └─→ TRADE_EXECUTED         (inventory debited at locked rate)
    TRADE_EXECUTED
      └─→ TRADE_SETTLED ✓        (full crypto delivered on-chain — terminal)
    ORDER_EXPIRED
      └─→ FAILED ✗               (refund per re-quote / refund flow)
    FAILED ✗                     (terminal — reserved for ops reject, sanctions, on-chain
                                  failure, refund; NOT yet triggered by any automated path)
    ```

    On-ramp **always settles the full amount in one shot**. The confirmed
    fiat settlement must match the order amount exactly — partial wires
    cannot be recorded against an order in the current operational flow.
    If you wire an amount different from the order's `fiatAmount`, contact
    your Hex Trust representative to resolve it out-of-band.

    ## Crypto Destination Resolution
    The crypto destination (stablecoin delivery address) is resolved at
    `acceptQuote` time:
    - If the request carries a `settlementAddress`, it is used — after
      validation against the trading client's whitelisted addresses in the
      counterparty service (or a HexSafe enterprise vault address). An address
      matching neither is rejected with error `-32045`
      (settlement address not valid / not in whitelist).
    - Otherwise the **default address per chain** configured on the
      trading-client counterparty service is used. The default must resolve to
      an active whitelisted address; if no default is configured for the
      quote's chain, `acceptQuote` returns error `-32046` (no settlement
      address configured for this client).

    ## Jurisdiction Scoping
    Every response is filtered by the requesting client's **jurisdiction**,
    resolved server-side from `X-Client-Id` (and confirmed by `X-Enterprise-Id`).

    Hex Trust's onboarding model:
    - Each `client_id` is the trading-client counterparty record
    - Each `client_id` is bound to **exactly one** HTM legal entity at onboarding (1:1)
    - Each HTM entity has **exactly one** licensed jurisdiction (1:1)
    - Therefore: `client_id → entity → jurisdiction` is unambiguously
      derivable, and the client never specifies it on requests

    A fintech contracted with multiple HTM entities (e.g., both SG and SVG)
    holds **multiple `client_id`s**, one per entity, and switches per request.

    Phase 1 launches under **SVG** (St. Vincent and the Grenadines).

    ## Phase 1 Scope
    - **Stablecoins only** — USDC, USDT (others TBD)
    - **Fiat coverage** — USD, EUR, GBP, AED, SGD, HKD (priority TBD)
    - **Minimum trade size** — 10 USD equivalent
    - **Trade execution** — from Hex Trust inventory (no LP hedge per trade)
    - **Inventory management** — not gating the API; on insufficient inventory
      at execution time, automation fails and ops + traders are notified via
      Slack to settle manually. **Inventory reservation at `acceptQuote` is
      deferred to Phase 2** (see backlog B5)
    - **Counterparty whitelist** — ops-managed via HexAdmin at client
      onboarding. **Self-serve whitelist API is deferred to Phase 2** (see
      backlog B4)
    - **Travel Rule** — captured at Phase 1 from the registered counterparty
      record on the crypto-out leg

servers:
  - url: https://api.hexsafe.hextrust.com/v1
    description: Production
  - url: https://api.sandbox.hexsafe.hextrust.com/v1
    description: Sandbox

security:
  - APIKey: []
  - Bearer: []

tags:
  - name: onramp
    description: On-Ramp fiat → stablecoin flow

paths:
  /onramp/availablePairs:
    get:
      summary: Get available trading pairs
      description: |
        Lists the (fiat → stablecoin) pairs available for on-ramp trades.

        Results are **filtered server-side by the requesting client's
        jurisdiction** (resolved from `X-Client-Id` / `X-Enterprise-Id`).
        Different Hex Trust legal entities (SVG, SG, UAE, HK) have different
        licensed pair sets and supported chains.
      operationId: getAvailablePairs
      tags: [onramp]
      parameters:
        - $ref: "#/components/parameters/XClientId"
        - $ref: "#/components/parameters/XEnterpriseId"
        - name: fiatCurrency
          in: query
          required: false
          description: Filter pairs by fiat currency (e.g. USD)
          schema:
            type: string
        - name: cryptoCurrency
          in: query
          required: false
          description: Filter pairs by stablecoin (e.g. USDC). Combined with fiatCurrency as AND.
          schema:
            type: string
      responses:
        "200":
          description: List of available pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailablePair"
        "400":
          $ref: "#/components/responses/Error"

  /onramp/assetInfo:
    get:
      summary: Get asset info
      description: Returns asset metadata required when filling in a quote request.
      operationId: getAssetInfo
      tags: [onramp]
      parameters:
        - $ref: "#/components/parameters/XClientId"
        - $ref: "#/components/parameters/XEnterpriseId"
        - name: assetKey
          in: query
          description: Asset ticker key (e.g. USDC)
          schema:
            type: string
      responses:
        "200":
          description: Asset info list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetInfo"
        "400":
          $ref: "#/components/responses/Error"

  /onramp/getQuote:
    post:
      summary: Request a quote
      description: |
        Request an on-ramp quote for a given fiat → stablecoin pair and amount.

        Provide either `fiatAmount` (fiat the client will wire) or `cryptoAmount`
        (stablecoin the client expects to receive). The other is calculated
        from the live LP price + Hex Trust spread.

        Returns a `quoteId` valid until `validTimestamp` (typically ~5 minutes).
      operationId: getQuote
      tags: [onramp]
      parameters:
        - $ref: "#/components/parameters/XClientIdRequired"
        - $ref: "#/components/parameters/XEnterpriseIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetQuoteRequest"
      responses:
        "200":
          description: Quote details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetQuoteResponse"
        "400":
          $ref: "#/components/responses/Error"

  /onramp/acceptQuote:
    post:
      summary: Accept a quote
      description: |
        Bind the locked quote and receive Hex Trust's bank account details for
        the fiat wire.

        The `chainId` is **encoded in the `quoteId`** from `getQuote` — it does
        not need to be passed again.

        Returns an `orderId` to track the on-ramp order via `orderStatus` and
        webhook events. The order window (configurable per environment, default
        48h) begins from this point — the client should wire fiat before
        `expiresAt`.

        **Crypto destination** — pass an optional whitelisted
        `settlementAddress` to override per order; otherwise the
        trading-client's default whitelisted address for the quote's chain is
        used. Errors: `-32045` (address not in whitelist), `-32046` (no
        default configured for the chain).
      operationId: acceptQuote
      tags: [onramp]
      parameters:
        - $ref: "#/components/parameters/XClientIdRequired"
        - $ref: "#/components/parameters/XEnterpriseIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptQuoteRequest"
      responses:
        "200":
          description: Accepted quote with bank account instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptQuoteResponse"
        "400":
          $ref: "#/components/responses/Error"

  /onramp/orderStatus:
    get:
      summary: Get order status
      description: |
        Query the current state of an on-ramp order by `orderId`.

        Returns the locked quote details, the bank account the client should
        wire to, the resolved crypto destination, and arrays of fiat-deposit
        and crypto-settlement transactions as they accrue.
      operationId: getOrderStatus
      tags: [onramp]
      parameters:
        - $ref: "#/components/parameters/XClientId"
        - $ref: "#/components/parameters/XEnterpriseIdRequired"
        - name: orderId
          in: query
          required: true
          description: Order ID returned by acceptQuote
          schema:
            type: string
            format: uuid
            example: 73797374-656d-4000-0000-00008badf00d
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusResponse"
        "400":
          $ref: "#/components/responses/Error"

  /onramp/orderHistory:
    get:
      summary: Get order history
      description: Query all orders within a time range. Max 1000 records per call; use `moreData` to paginate.
      operationId: getOrderHistory
      tags: [onramp]
      parameters:
        - $ref: "#/components/parameters/XClientId"
        - $ref: "#/components/parameters/XEnterpriseIdRequired"
        - name: startTime
          in: query
          required: true
          description: Start of range (Unix ms)
          schema:
            type: integer
            format: int64
            example: 1732752000000
        - name: endTime
          in: query
          required: true
          description: End of range (Unix ms)
          schema:
            type: integer
            format: int64
            example: 1740614400000
        - name: limit
          in: query
          description: "Max records to return (default: 100, max: 1000)"
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Paginated order history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderHistoryResponse"
        "400":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: X-API-KEY
      description: API key ID issued by Hex Trust
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT signed with the client's private key

  parameters:
    XClientId:
      name: X-Client-Id
      in: header
      description: Trading client ID
      schema:
        type: string
        example: 532e2873-3295-4fad-be8e-0a4c0c4647b2
    XClientIdRequired:
      name: X-Client-Id
      in: header
      required: true
      description: Trading client ID
      schema:
        type: string
        example: 532e2873-3295-4fad-be8e-0a4c0c4647b2
    XEnterpriseId:
      name: X-Enterprise-Id
      in: header
      description: Enterprise ID
      schema:
        type: string
        example: 8a5f6d1c-4d3e-47e1-9e8f-0b3c2d4e5f6a
    XEnterpriseIdRequired:
      name: X-Enterprise-Id
      in: header
      required: true
      description: Enterprise ID
      schema:
        type: string
        example: 8a5f6d1c-4d3e-47e1-9e8f-0b3c2d4e5f6a

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: |
        Hex Trust error envelope: `{code, message}` where `code` is numeric.

        **HTTP status mapping** — gateway-level failures (binding/validation,
        auth) return HTTP 400/401/403 with positive codes (e.g. `40001`
        invalid request, `40100` unauthorized, `40300` permission denied).
        Business errors from the trading service surface with **HTTP 500**
        and a negative JSON-RPC code.

        Key business codes (non-exhaustive):
        - `-32602` — invalid params (malformed quoteId, both or neither of
          `fiatAmount`/`cryptoAmount`, unsupported pair or chain, ...)
        - `-32010` — LP relay failure. Also covers amounts outside the LP's
          min/max limits (not pre-validated server-side) and transient LP
          outages — safe to retry.
        - `-32042` — conflict (quote already accepted)
        - `-32043` — quote expired
        - `-32045` — settlement address not valid / not found in whitelist
        - `-32046` — no settlement address configured for this client + chain
        - `-32047` / `-32048` — LP routing not configured for the client's
          broker entity
      properties:
        code:
          type: integer
          example: -32046
        message:
          type: string
          example: No settlement address configured for this client
      required: [code, message]

    OrderStatus:
      type: string
      description: |
        On-ramp order state:
        - `ORDER_CREATED` — quote accepted; rate locked; bank account issued; awaiting fiat
        - `FIAT_RECEIVED` — full fiat amount confirmed by ops (CL1 settled)
        - `TRADE_EXECUTED` — inventory debited at locked rate; awaiting on-chain confirmation
        - `TRADE_SETTLED` — stablecoin on-chain confirmed to client wallet ✓ terminal
        - `ORDER_EXPIRED` — window elapsed without full fiat ✗
        - `FAILED` — terminal failure (ops reject, sanctions, on-chain failure, refund) ✗ — defined but not yet triggered by any automated path
      enum:
        - ORDER_CREATED
        - FIAT_RECEIVED
        - TRADE_EXECUTED
        - TRADE_SETTLED
        - ORDER_EXPIRED
        - FAILED
      example: ORDER_CREATED

    AvailablePair:
      type: object
      description: |
        A (fiat → stablecoin) trading pair. Results from `/onramp/availablePairs`
        are **filtered server-side by the requesting client's jurisdiction**
        (resolved from `X-Client-Id` / `X-Enterprise-Id`). Different Hex Trust
        legal entities (SVG, SG, UAE, HK) have different licensed pair sets.
      properties:
        fiatCurrency:
          type: string
          description: Fiat currency code
          example: USD
        cryptoCurrency:
          type: string
          description: Stablecoin ticker
          example: USDC
        fiatMinAmount:
          type: number
          minimum: 0
          description: |
            Minimum trade size in the fiat currency, sourced from the routed
            liquidity provider's limits.

            NOTE — the four limit fields are JSON **numbers** (unlike amount
            fields elsewhere in this API, which are strings), and they are
            advisory: `getQuote` does not pre-validate against them. An
            out-of-range amount is rejected by the LP and surfaces as error
            `-32010`. Validate client-side before quoting.
          example: 1
        fiatMaxAmount:
          type: number
          minimum: 0
          description: Maximum trade size in the fiat currency (LP-sourced, advisory).
          example: 2000000
        cryptoMinAmount:
          type: number
          minimum: 0
          description: Minimum trade size in the stablecoin (LP-sourced, advisory).
          example: 10
        cryptoMaxAmount:
          type: number
          minimum: 0
          description: Maximum trade size in the stablecoin (LP-sourced, advisory).
          example: 2000000
        supportedChains:
          type: array
          description: Chains on which the stablecoin can be delivered for this pair
          items:
            type: object
            properties:
              chainId:
                type: string
                example: "1"
              chainName:
                type: string
                example: ethereum
      required: [fiatCurrency, cryptoCurrency, fiatMinAmount, fiatMaxAmount, cryptoMinAmount, cryptoMaxAmount, supportedChains]

    AssetInfo:
      type: object
      properties:
        key:
          type: string
          example: USDC
        name:
          type: string
          example: USD Coin
        decimal:
          type: integer
          example: 6
        chainId:
          type: string
          example: "1"
        symbol:
          type: string
          example: USDC
        chainName:
          type: string
          example: ethereum
      required: [key, name, decimal, symbol]

    GetQuoteRequest:
      type: object
      description: |
        **Exactly one** of `fiatAmount` or `cryptoAmount` must be provided —
        not both, not neither. The server derives the other side from the live
        LP price + Hex Trust spread and returns both values in the quote.

        `chainId` is required because price and inventory can vary per chain.
        The quote is bound to the (`fiatCurrency`, `cryptoCurrency`, `chainId`)
        combination and the resolved chain is encoded into the returned
        `quoteId`.
      properties:
        fiatCurrency:
          type: string
          description: Fiat currency the client will wire
          example: USD
        cryptoCurrency:
          type: string
          description: Stablecoin the client will receive
          example: USDC
        chainId:
          type: string
          description: |
            Chain on which the stablecoin should be delivered (e.g. "1" for
            Ethereum mainnet). Must be one of the `supportedChains` for the
            pair, AND licensed for the requesting client's jurisdiction.
          example: "1"
        fiatAmount:
          type: string
          description: |
            Fiat amount the client will wire. Provide **this OR `cryptoAmount`**,
            not both. Mutually exclusive with `cryptoAmount`.
          example: "100000.00"
        cryptoAmount:
          type: string
          description: |
            Stablecoin amount the client expects to receive. Provide **this OR
            `fiatAmount`**, not both. Mutually exclusive with `fiatAmount`.
          example: "99950.00"
      required: [fiatCurrency, cryptoCurrency, chainId]
      oneOf:
        - required: [fiatAmount]
          not: { required: [cryptoAmount] }
        - required: [cryptoAmount]
          not: { required: [fiatAmount] }

    GetQuoteResponse:
      type: object
      properties:
        quoteId:
          type: string
          format: uuid
          example: 73797374-656d-4000-8000-00008badf00d
        fiatCurrency:
          type: string
          example: USD
        cryptoCurrency:
          type: string
          example: USDC
        chainId:
          type: string
          description: Chain the quote is bound to (echoed back from the request for confirmation)
          example: "1"
        chainName:
          type: string
          example: ethereum
        fiatAmount:
          type: string
          description: Fiat amount the client must wire
          example: "100000.00"
        cryptoAmount:
          type: string
          description: Stablecoin amount the client will receive
          example: "99950.00"
        ratio:
          type: string
          description: Exchange rate (cryptoCurrency per fiatCurrency; includes Hex Trust spread)
          example: "0.99950"
        inverseRatio:
          type: string
          description: Inverse exchange rate (fiatCurrency per cryptoCurrency)
          example: "1.00050"
        validTimestamp:
          type: integer
          format: int64
          description: Quote expiry time (Unix ms) — typically ~5 minutes after issue
          example: 1741124356789
      required: [quoteId, fiatCurrency, cryptoCurrency, chainId, fiatAmount, cryptoAmount, ratio, inverseRatio, validTimestamp]

    AcceptQuoteRequest:
      type: object
      description: |
        Bind the locked quote and create an order. The chain (and therefore the
        crypto destination address) is already encoded in the `quoteId` from
        `getQuote` — clients do not need to pass it again.
      properties:
        quoteId:
          type: string
          format: uuid
          description: Quote ID from getQuote
          example: 73797374-656d-4000-8000-00008badf00d
        clientUserId:
          type: string
          description: |
            Optional opaque reference to the client's own end user. Free-text
            passthrough — no format or uniqueness constraint. Echoed on
            `orderStatus`, `orderHistory`, and every webhook for the order.
            (Replaces the former `clientOrderId` field, which was removed.)
          example: 2f12878a-5edd-4539-af64-85c60ea17682
        settlementAddress:
          type: string
          description: |
            Optional per-order crypto destination override. Must be one of the
            trading client's whitelisted addresses (or a HexSafe enterprise
            vault address) on the quote's chain — otherwise rejected with
            error `-32045`. When omitted, the pre-configured default for the
            chain is used (`-32046` if no default exists).
          example: "0x95222290DD7278Aa3Ddd389Cc1E1d165CC4BAfe5"
      required: [quoteId]

    BankAccount:
      type: object
      description: |
        Hex Trust's shared bank account for receiving fiat wires. The same
        account is used across clients for a given currency / rail; ops matches
        inbound wires to orders by amount + originating bank + timing.

        No per-order reference code is required in the wire memo.
      properties:
        beneficiaryName:
          type: string
          example: Hex Trust Markets Ltd
        beneficiaryAddress:
          type: string
          example: 123 Market Street, Suite 100, Saint Vincent and the Grenadines
        bankName:
          type: string
          example: Standard Chartered Bank
        accountNumber:
          type: string
          example: "01234567890123"
        iban:
          type: string
          description: IBAN if applicable to the rail
          example: AE070331234567890123456
        swiftCode:
          type: string
          example: SCBLAEAAXXX
        routingNumber:
          type: string
          description: Fedwire / ABA routing number for USD domestic wires
          example: "026002561"
        intermediaryBank:
          type: object
          description: Intermediary correspondent bank if required by the rail (typically for SWIFT)
          properties:
            bankName:
              type: string
              example: Standard Chartered Bank, New York
            swiftCode:
              type: string
              example: SCBLUS33XXX
            routingNumber:
              type: string
              example: "026002561"
        currency:
          type: string
          example: USD
      required: [beneficiaryName, bankName, currency]

    AcceptQuoteResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
          description: Unique identifier for tracking this order
          example: 73797374-656d-4000-0000-00008badf00d
        createTime:
          type: integer
          format: int64
          description: Order creation time (Unix ms)
          example: 1741123456789
        expiresAt:
          type: integer
          format: int64
          description: Order window expiry — fiat must arrive before this (Unix ms)
          example: 1741296256789
        bankAccounts:
          type: array
          description: |
            All Hex Trust bank accounts available for the order's currency
            under the trading client's HTM broker entity.

            **Scope** — derived implicitly from `client_id`:
            `client_id → HTM broker entity → jurisdiction → enabled bank accounts
            for the requested currency`. No additional filtering is applied.

            **Multiple options** give the client choice across banks (e.g. BCB +
            Standard Chartered) and rails (Fedwire / SWIFT / SEPA) for the same
            currency. The client picks whichever best matches their own banking
            relationship.

            **Snapshot semantics** — the array is captured at `acceptQuote`
            time and locked on the order. Bank accounts added or disabled
            later affect only new orders.

            **Ops matching** — ops matches the inbound wire by amount +
            originating bank regardless of which Hex Trust account received it,
            so the client does not need to declare their choice to the server.
          items:
            $ref: "#/components/schemas/BankAccount"
          minItems: 1
        cryptoDestination:
          type: string
          description: |
            Resolved on-chain destination address for the stablecoin delivery
            (read from the trading-client's default whitelisted address for the
            requested chain).
          example: "0x4f5CE5FBFe3E9af3971dD833D26BA9b5C936f0bF"
        chainId:
          type: string
          example: "1"
        chainName:
          type: string
          example: ethereum
        fiatAmount:
          type: string
          example: "100000.00"
        cryptoAmount:
          type: string
          example: "99950.00"
        lockedRate:
          type: string
          description: Exchange rate locked at acceptQuote (cryptoCurrency per fiatCurrency)
          example: "0.99950"
        orderStatus:
          $ref: "#/components/schemas/OrderStatus"
      required: [orderId, createTime, expiresAt, bankAccounts, cryptoDestination, chainId, fiatAmount, cryptoAmount, lockedRate, orderStatus]

    FiatDepositTransaction:
      type: object
      description: A confirmed fiat wire received against an order
      properties:
        bankTxId:
          type: string
          description: Bank's transaction reference (from wire MT103 / Fedwire)
          example: SCB20260527000123
        amount:
          type: string
          description: Fiat amount received in this wire
          example: "100000.00"
        currency:
          type: string
          example: USD
        valueDate:
          type: integer
          format: int64
          description: Bank's value date for the wire (Unix ms)
          example: 1741200000000
        confirmedAt:
          type: integer
          format: int64
          description: Time ops confirmed the deposit in HexAdmin (Unix ms)
          example: 1741210000000
        originatingBank:
          type: string
          description: Bank that originated the wire (from MT103 field 52A or equivalent)
          example: HSBC HONG KONG
        status:
          type: string
          enum: [CONFIRMED, REJECTED]
          example: CONFIRMED
        rejectionReason:
          type: string
          description: Present when status = REJECTED (e.g. source-of-funds mismatch, sanctions)
          example: Originating bank does not match registered client bank
      required: [bankTxId, amount, currency, confirmedAt, status]

    CryptoSettlementTransaction:
      type: object
      description: A stablecoin delivery to the client's whitelisted wallet
      properties:
        txHash:
          type: string
          example: "0x7c8a9b3f4e5d6c2a1b9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6"
        chainId:
          type: string
          example: "1"
        amount:
          type: string
          description: Stablecoin amount delivered
          example: "99950.00"
        asset:
          type: string
          example: USDC
        from:
          type: string
          description: Hex Trust source vault address
          example: "0x3f5CE5FBFe3E9af3971dD833D26BA9b5C936f0bE"
        to:
          type: string
          description: Client's whitelisted destination address
          example: "0x4f5CE5FBFe3E9af3971dD833D26BA9b5C936f0bF"
        confirmedAt:
          type: integer
          format: int64
          description: Block-confirmation time (Unix ms)
          example: 1741300000000
        status:
          type: string
          enum: [PENDING, CONFIRMED, FAILED]
          example: CONFIRMED
      required: [txHash, chainId, amount, asset, status]

    OrderStatusResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
          example: 73797374-656d-4000-0000-00008badf00d
        quoteId:
          type: string
          format: uuid
          example: 73797374-656d-4000-8000-00008badf00d
        orderStatus:
          $ref: "#/components/schemas/OrderStatus"
        fiatCurrency:
          type: string
          example: USD
        fiatAmount:
          type: string
          description: Locked fiat amount the client should wire
          example: "100000.00"
        cryptoCurrency:
          type: string
          example: USDC
        cryptoAmount:
          type: string
          description: Locked stablecoin amount to be delivered
          example: "99950.00"
        lockedRate:
          type: string
          example: "0.99950"
        inverseRate:
          type: string
          example: "1.00050"
        bankAccounts:
          type: array
          description: All bank-account options the client could wire to (echoed from the original `acceptQuote` response for reference / auditability)
          items:
            $ref: "#/components/schemas/BankAccount"
          minItems: 1
        cryptoDestination:
          type: string
          example: "0x4f5CE5FBFe3E9af3971dD833D26BA9b5C936f0bF"
        chainId:
          type: string
          example: "1"
        chainName:
          type: string
          example: ethereum
        expiresAt:
          type: integer
          format: int64
          example: 1741296256789
        createTime:
          type: integer
          format: int64
          example: 1741123456789
        fiatReceivedAt:
          type: integer
          format: int64
          description: Time ops confirmed CL1 settlement (Unix ms); null until FIAT_RECEIVED
          example: 1741210000000
        tradeExecutedAt:
          type: integer
          format: int64
          description: Time inventory was debited at the locked rate; null until TRADE_EXECUTED
          example: 1741210050000
        settledAt:
          type: integer
          format: int64
          description: Time the on-chain crypto settlement confirmed; null until TRADE_SETTLED
          example: 1741300000000
        receivedFiatAmount:
          type: string
          description: |
            Cumulative fiat received so far.
          example: "100000.00"
        amendedFiatAmount:
          type: string
          description: |
            If the trader amended the order amount (ops-driven, exceptional),
            this is the new locked `fiatAmount`. The on-chain delivery is sized
            against this amended amount.
          example: "100000.00"
        clientId:
          type: string
          format: uuid
          example: 532e2873-3295-4fad-be8e-0a4c0c4647b2
        clientUserId:
          type: string
          description: |
            Client-supplied end-user reference from `acceptQuote`. Absent
            (omitted, not null) when not provided — including all orders
            created before this field existed.
          example: 2f12878a-5edd-4539-af64-85c60ea17682
        enterpriseId:
          type: string
          format: uuid
          example: 8a5f6d1c-4d3e-47e1-9e8f-0b3c2d4e5f6a
        failureReason:
          type: string
          description: Present when orderStatus = FAILED
          example: Refunded due to sanctions screening hit on originating bank
        fiatDepositTransactions:
          type: array
          items:
            $ref: "#/components/schemas/FiatDepositTransaction"
        cryptoSettlementTransactions:
          type: array
          items:
            $ref: "#/components/schemas/CryptoSettlementTransaction"
      required:
        - orderId
        - quoteId
        - orderStatus
        - fiatCurrency
        - fiatAmount
        - cryptoCurrency
        - cryptoAmount
        - lockedRate
        - inverseRate
        - bankAccounts
        - cryptoDestination
        - chainId
        - chainName
        - expiresAt
        - createTime
        - fiatDepositTransactions
        - cryptoSettlementTransactions

    OrderHistoryResponse:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/OrderStatusResponse"
          description: Order records in the requested time range
        startTime:
          type: integer
          format: int64
          example: 1732752000000
        endTime:
          type: integer
          format: int64
          example: 1740614400000
        limit:
          type: integer
          example: 100
        moreData:
          type: boolean
          description: True if additional records exist beyond this page
          example: false
      required: [list, startTime, endTime, limit, moreData]

    WebhookEnvelope:
      type: object
      description: |
        Top-level webhook body delivered to the client's registered callback URL.
        Mirrors the Convert-to-Pay webhook envelope so clients integrating both
        APIs can share most of their delivery handling.

        **Structure**

        - `payload` — the event envelope (event type, delivery metadata, data,
          metadata block)
        - `signature` — base64-encoded **Ed25519 signature** over the
          JSON-marshaled `payload` field. Clients verify with Hex Trust's
          Ed25519 **public key** (distributed out-of-band by the HT
          relationship manager at onboarding). Asymmetric — no shared secret.

        **Delivery semantics**

        - At-least-once delivery
        - Retries reuse the same `payload.id`; `payload.retryNum` increments
          each attempt
        - Clients dedupe by `payload.id` (preferred) or by
          `payload.data.orderId + payload.eventType`
        - Flat per-webhook-URL retry interval (configured at onboarding), polled by a background cron every `RETRY_FAILED_NOTI_INTERVAL` (default 60s); stopped after `maxRetries` (also configurable per webhook URL)
        - HTTPS only; client returns 2xx within **8 seconds** (`CLIENT_TIMEOUT` default) to ack
      properties:
        payload:
          $ref: "#/components/schemas/WebhookPayload"
        signature:
          type: string
          description: |
            Base64-encoded Ed25519 signature over the bytes produced by
            JSON-marshaling the `payload` field. Hex Trust signs with its
            webhook private key. Clients verify with Hex Trust's published
            Ed25519 public key (distributed out-of-band by the HT
            relationship manager at onboarding).

            Verification gotcha — the client must re-serialize `payload` with a
            JSON library byte-compatible with Go's `encoding/json` (key order
            as-emitted by the server, no extra whitespace). RFC 8785 canonical
            JSON is NOT used.
          example: ZVs91ITiPcgVKOOewoySZPwq7aGaFAv+7P6jMFGYVoSu5bPNdc3HEaQLz2yySLcLraeJW3evkskymLRuoAVmDQ==
      required: [payload, signature]

    WebhookPayload:
      type: object
      description: |
        The event envelope inside a webhook delivery. Wraps the event metadata,
        the per-event `data` block, and an `metadata` block with API version /
        environment.

        **Lookup conventions inside `data.order`**

        | Looking for | Read from `data.order` |
        |---|---|
        | The bank tx that just confirmed | `fiatDepositTransactions` — last entry by `confirmedAt` |
        | The on-chain tx that just settled | `cryptoSettlementTransactions` — last entry by `confirmedAt` |
        | Failure reason | `failureReason` |
        | When fiat was confirmed | `fiatReceivedAt` |
        | When inventory debit completed | `tradeExecutedAt` |
        | When on-chain settled | `settledAt` |

        **Events**

        | Event | Fires when | Post-event `data.order.orderStatus` |
        |---|---|---|
        | `ORDER_CREATED` | acceptQuote bound; bank accounts issued | `ORDER_CREATED` |
        | `FIAT_RECEIVED` | Ops confirms full fiat (CL1 settled) | `FIAT_RECEIVED` |
        | `TRADE_EXECUTED` | Inventory debited at locked rate | `TRADE_EXECUTED` |
        | `TRADE_SETTLED` ✓ | Crypto on-chain confirmed (always full amount) | `TRADE_SETTLED` |
        | `ORDER_EXPIRED` | Window elapsed without full fiat | `ORDER_EXPIRED` |
        | `FAILED` ✗ | Terminal failure (defined; not yet triggered by any automated path) | `FAILED` |
      properties:
        eventType:
          type: string
          enum:
            - ORDER_CREATED
            - FIAT_RECEIVED
            - TRADE_EXECUTED
            - TRADE_SETTLED
            - ORDER_EXPIRED
            - FAILED
          example: FIAT_RECEIVED
        id:
          type: string
          format: uuid
          description: |
            Unique webhook delivery ID. Stable across retries of the same
            delivery — clients should use this as the primary dedupe key.
          example: 11e0177f-25d5-5cbe-9aba-1c46cb66f69d
        currentWebhookCallAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of this delivery attempt
          example: "2026-06-07T12:16:10.273Z"
        eventTriggerAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the event originally fired server-side
          example: "2026-06-07T12:16:07.813Z"
        firstWebhookCallAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the first delivery attempt
          example: "2026-06-07T12:16:08.958Z"
        retryNum:
          type: integer
          minimum: 0
          description: |
            Number of delivery attempts so far. Starts at 0 on first delivery
            and increments on each retry. The webhook `id` stays the same
            across retries.
          example: 0
        data:
          $ref: "#/components/schemas/WebhookData"
        metadata:
          $ref: "#/components/schemas/WebhookMetadata"
      required: [eventType, id, currentWebhookCallAt, eventTriggerAt, firstWebhookCallAt, retryNum, data, metadata]

    WebhookData:
      type: object
      description: |
        Per-event data block. Carries the business identifiers and the full
        order snapshot. There are no event-specific top-level fields — the
        `order` snapshot already includes everything needed to interpret the
        event (`order.orderStatus`, populated timestamp fields, history arrays).
      properties:
        orderId:
          type: string
          format: uuid
          description: Stable order identifier, present on every event for this order
          example: 73797374-656d-4000-0000-00008badf00d
        order:
          allOf:
            - $ref: "#/components/schemas/OrderStatusResponse"
            - description: |
                Full snapshot of the order resource, identical in shape to the
                `GET /onramp/orderStatus` response — plus the three
                **webhook-only, best-effort enrichment fields** below, which
                may be absent on any given event (their lookups are
                fire-and-forget server-side). Reflects the **post-event
                state** — `orderStatus`, timestamp fields (`fiatReceivedAt`,
                `tradeExecutedAt`, `settledAt`), and history arrays
                (`fiatDepositTransactions`, `cryptoSettlementTransactions`) are
                all updated to reflect that this event has just been applied.
              properties:
                clientName:
                  type: string
                  description: Trading-client display name (best-effort — may be absent)
                  example: Hubpay Ltd
                enterpriseName:
                  type: string
                  description: Enterprise display name (best-effort — may be absent)
                  example: Hubpay
                hexBrokerEntityName:
                  type: string
                  description: Hex Trust broker legal-entity name (best-effort — may be absent)
                  example: Hex Trust Markets Ltd
      required: [orderId, order]

    WebhookMetadata:
      type: object
      description: Delivery metadata (API version, environment) — same shape as Convert-to-Pay.
      properties:
        apiVersion:
          type: string
          example: "1.0"
        environment:
          type: string
          enum: [production, staging]
          example: production
      required: [apiVersion, environment]

# ============================================================================
# Webhook Examples — one per event type (full WebhookEnvelope payload)
# ============================================================================
# Inline examples for each webhook event. Clients can use these to validate
# their parser implementations. Each example is the complete request body
# Hex Trust delivers to the client's callback URL.
#
# The `signature` field carries the base64-encoded Ed25519 signature over
# the bytes produced by `json.Marshal(payload)` (Go's encoding/json output).
# Clients verify with Hex Trust's Ed25519 public key, distributed out-of-band
# by the HT relationship manager at onboarding. Example signatures below are
# placeholders.

