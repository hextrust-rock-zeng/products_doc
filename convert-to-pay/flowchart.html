<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
body{background:#0f172a;margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
h1{text-align:center;color:#7dd3fc;font-size:19px;margin:0 0 4px;font-weight:600}
p.sub{text-align:center;color:#64748b;font-size:13px;margin:0 0 14px}
</style>
</head>
<body>
<h1>Convert-to-Pay — Payment Flow</h1>
<p class="sub">Four scenarios for stakeholder &amp; client review</p>
<svg viewBox="0 0 1100 1630" style="width:100%;display:block;max-width:1100px;margin:0 auto">
<defs>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
  <marker id="awh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker>
</defs>

<!-- ===== LANE HEADERS ===== -->
<rect x="5"   y="5" width="205" height="44" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="108" y="32" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">Payer</text>
<rect x="220" y="5" width="215" height="44" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="328" y="32" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">HubPay (Client)</text>
<rect x="445" y="5" width="295" height="44" rx="7" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
<text x="593" y="32" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="bold">Hex Trust System</text>
<rect x="750" y="5" width="240" height="44" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text x="870" y="32" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">Blockchain</text>

<!-- ===== LIFELINES ===== -->
<line x1="108" y1="49" x2="108" y2="1625" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,6"/>
<line x1="328" y1="49" x2="328" y2="1625" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,6"/>
<line x1="593" y1="49" x2="593" y2="1625" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,6" opacity="0.3"/>
<line x1="870" y1="49" x2="870" y2="1625" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,6"/>

<!-- ================================================================ -->
<!-- FLOW 1 — Full payment within window                              -->
<!-- ================================================================ -->
<rect x="0" y="58" width="1100" height="30" fill="#0c2340"/>
<text x="550" y="78" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="bold">FLOW 1 — Full payment within quote window  →  immediate settlement</text>

<!-- HubPay → HexTrust: accept-quote -->
<text x="461" y="107" text-anchor="middle" fill="#94a3b8" font-size="11">POST /accept-quote  (amount, currency, depositAddress?)</text>
<line x1="328" y1="118" x2="585" y2="118" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

<!-- HexTrust → HubPay: quote -->
<text x="461" y="145" text-anchor="middle" fill="#94a3b8" font-size="11">quote: rate · crypto_amount · deposit_address · expiry</text>
<line x1="593" y1="156" x2="336" y2="156" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

<!-- HubPay → Payer: instructions -->
<text x="218" y="183" text-anchor="middle" fill="#94a3b8" font-size="11">send [crypto_amount] to [address] before expiry</text>
<line x1="328" y1="194" x2="116" y2="194" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

<!-- Payer → Blockchain: sends full -->
<text x="489" y="221" text-anchor="middle" fill="#94a3b8" font-size="11">sends full crypto amount on-chain</text>
<line x1="108" y1="232" x2="862" y2="232" stroke="#94a3b8" stroke-width="2" marker-end="url(#ab)"/>

<!-- Blockchain → HexTrust: confirmation -->
<text x="732" y="259" text-anchor="middle" fill="#94a3b8" font-size="11">on-chain confirmation  (cumulative = full amount)</text>
<line x1="870" y1="270" x2="601" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#ab)"/>

<!-- internal: cumulative = full trigger -->
<rect x="453" y="281" width="280" height="26" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
<text x="593" y="298" text-anchor="middle" fill="#93c5fd" font-size="11">cumulative = full  →  trigger immediate settlement</text>

<!-- HexTrust → HubPay: DEPOSIT_FULL_AMOUNT_COMPLETED -->
<text x="461" y="326" text-anchor="middle" fill="#c4b5fd" font-size="11">⚡ webhook: DEPOSIT_FULL_AMOUNT_COMPLETED</text>
<text x="461" y="339" text-anchor="middle" fill="#94a3b8" font-size="10.5">(full amount confirmed · refundableAmount if overpaid)</text>
<line x1="593" y1="352" x2="336" y2="352" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#awh)"/>

<!-- HexTrust → HubPay: PAYMENT_EXECUTED -->
<text x="461" y="379" text-anchor="middle" fill="#c4b5fd" font-size="11">⚡ webhook: PAYMENT_EXECUTED</text>
<text x="461" y="392" text-anchor="middle" fill="#94a3b8" font-size="10.5">(conversion committed at original quoted rate · outstandingCrypto=0 ✓)</text>
<line x1="593" y1="405" x2="336" y2="405" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#awh)"/>

<!-- HexTrust → HubPay: SETTLED_FULL_AMOUNT -->
<text x="461" y="432" text-anchor="middle" fill="#c4b5fd" font-size="11">⚡ webhook: SETTLED_FULL_AMOUNT</text>
<text x="461" y="445" text-anchor="middle" fill="#94a3b8" font-size="10.5">(fiat amount delivered to client · outstandingCrypto=0 ✓)</text>
<line x1="593" y1="458" x2="336" y2="458" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#awh)"/>

<!-- HubPay → Payer: confirmed -->
<text x="218" y="485" text-anchor="middle" fill="#86efac" font-size="11">payment confirmed  ✓</text>
<line x1="328" y1="496" x2="116" y2="496" stroke="#34d399" stroke-width="2" marker-end="url(#ag)"/>

<!-- ================================================================ -->
<!-- FLOW 2 — Partial deposits                                         -->
<!-- ================================================================ -->
<rect x="0" y="516" width="1100" height="30" fill="#1c1400"/>
<text x="550" y="536" text-anchor="middle" fill="#fb923c" font-size="13" font-weight="bold">FLOW 2 — Partial deposit(s) within window  →  settlement executes at expiry</text>

<!-- HubPay → HexTrust -->
<text x="461" y="575" text-anchor="middle" fill="#94a3b8" font-size="11">POST /accept-quote  (amount, currency, depositAddress?)</text>
<line x1="328" y1="586" x2="585" y2="586" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

<!-- HexTrust → HubPay -->
<text x="461" y="613" text-anchor="middle" fill="#94a3b8" font-size="11">quote: rate · crypto_amount · deposit_address · expiry</text>
<line x1="593" y1="624" x2="336" y2="624" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

<!-- HubPay → Payer -->
<text x="218" y="651" text-anchor="middle" fill="#94a3b8" font-size="11">send [crypto_amount] to [address] before expiry</text>
<line x1="328" y1="662" x2="116" y2="662" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

<!-- Payer → Blockchain: partial -->
<text x="489" y="689" text-anchor="middle" fill="#94a3b8" font-size="11">sends PARTIAL crypto amount on-chain</text>
<line x1="108" y1="700" x2="862" y2="700" stroke="#94a3b8" stroke-width="2" marker-end="url(#ab)"/>

<!-- Blockchain → HexTrust -->
<text x="732" y="727" text-anchor="middle" fill="#94a3b8" font-size="11">on-chain confirmation  (partial,  cumulative &lt; full)</text>
<line x1="870" y1="738" x2="601" y2="738" stroke="#94a3b8" stroke-width="2" marker-end="url(#ab)"/>

<!-- HexTrust → HubPay: DEPOSIT_PARTIAL_AMOUNT -->
<text x="461" y="764" text-anchor="middle" fill="#c4b5fd" font-size="11">⚡ webhook: DEPOSIT_PARTIAL_AMOUNT</text>
<text x="461" y="777" text-anchor="middle" fill="#94a3b8" font-size="10.5">(deposited: X fiat · outstanding: Y fiat · outstandingCrypto: Z)</text>
<line x1="593" y1="790" x2="336" y2="790" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#awh)"/>

<!-- HubPay → Payer -->
<text x="218" y="817" text-anchor="middle" fill="#94a3b8" font-size="11">received X fiat  ·  Y fiat still outstanding</text>
<line x1="328" y1="828" x2="116" y2="828" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

<!-- more deposits note -->
<text x="550" y="852" text-anchor="middle" fill="#475569" font-size="11" font-style="italic">⋯  each additional deposit triggers another DEPOSIT_PARTIAL_AMOUNT webhook  ⋯</text>

<!-- EXPIRY BANNER -->
<rect x="0" y="862" width="1100" height="26" fill="#3b1f00"/>
<text x="550" y="879" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="bold">⏰  QUOTE EXPIRES  —  conversion executes at original quoted rate (~1-2 min buffer for in-flight deposits)</text>

<!-- HexTrust → HubPay: QUOTE_EXPIRED -->
<text x="461" y="912" text-anchor="middle" fill="#c4b5fd" font-size="11">⚡ webhook: QUOTE_EXPIRED</text>
<text x="461" y="925" text-anchor="middle" fill="#94a3b8" font-size="10.5">(quote window closed · outstandingFiat: Y · outstandingCrypto: Z)</text>
<line x1="593" y1="938" x2="336" y2="938" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#awh)"/>

<!-- HexTrust → HubPay: PAYMENT_EXECUTED (partial) -->
<text x="461" y="965" text-anchor="middle" fill="#c4b5fd" font-size="11">⚡ webhook: PAYMENT_EXECUTED</text>
<text x="461" y="978" text-anchor="middle" fill="#94a3b8" font-size="10.5">(conversion committed at ORIGINAL rate · fiat executed: X · outstandingCrypto: Z)</text>
<line x1="593" y1="991" x2="336" y2="991" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#awh)"/>

<!-- HexTrust → HubPay: SETTLED_PARTIAL_AMOUNT -->
<text x="461" y="1018" text-anchor="middle" fill="#c4b5fd" font-size="11">⚡ webhook: SETTLED_PARTIAL_AMOUNT</text>
<text x="461" y="1031" text-anchor="middle" fill="#94a3b8" font-size="10.5">(fiat settled: X · outstandingFromAmount: Y · outstandingToAmount: Z)</text>
<line x1="593" y1="1044" x2="336" y2="1044" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#awh)"/>

<!-- HubPay → Payer -->
<text x="218" y="1071" text-anchor="middle" fill="#fdba74" font-size="11">partial settled  ·  Y fiat still outstanding</text>
<line x1="328" y1="1082" x2="116" y2="1082" stroke="#fb923c" stroke-width="2" marker-end="url(#ao)"/>

<!-- ================================================================ -->
<!-- FLOW 3 — New quote for outstanding                                -->
<!-- ================================================================ -->
<rect x="0" y="1102" width="1100" height="30" fill="#0c2340"/>
<text x="550" y="1122" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">FLOW 3 — Outstanding amount: client requests new quote  (same depositAddress)</text>

<!-- HubPay → HexTrust: POST /quote -->
<text x="461" y="1160" text-anchor="middle" fill="#94a3b8" font-size="11">POST /quote  (outstandingFromAmount · currency)</text>
<line x1="328" y1="1170" x2="585" y2="1170" stroke="#34d399" stroke-width="2" marker-end="url(#ag)"/>

<!-- HexTrust → HubPay: quote response -->
<text x="461" y="1198" text-anchor="middle" fill="#94a3b8" font-size="11">quote: new rate · crypto_amount · quoteId · expiry</text>
<line x1="593" y1="1209" x2="336" y2="1209" stroke="#34d399" stroke-width="2" marker-end="url(#ag)"/>

<!-- HubPay → HexTrust: POST /accept-quote -->
<text x="461" y="1236" text-anchor="middle" fill="#94a3b8" font-size="11">POST /accept-quote  (quoteId · depositAddress)</text>
<line x1="328" y1="1247" x2="585" y2="1247" stroke="#34d399" stroke-width="2" marker-end="url(#ag)"/>

<!-- HexTrust → HubPay: confirmed, same address -->
<text x="461" y="1274" text-anchor="middle" fill="#86efac" font-size="10.5">confirmed: same deposit address reused  ·  new expiry window</text>
<line x1="593" y1="1285" x2="336" y2="1285" stroke="#34d399" stroke-width="2" marker-end="url(#ag)"/>

<!-- HubPay → Payer -->
<text x="218" y="1312" text-anchor="middle" fill="#94a3b8" font-size="11">send outstanding amount to same address</text>
<line x1="328" y1="1323" x2="116" y2="1323" stroke="#34d399" stroke-width="2" marker-end="url(#ag)"/>

<!-- continuation note -->
<rect x="240" y="1337" width="620" height="24" rx="5" fill="#0f2d1c" stroke="#16a34a" stroke-width="1.5"/>
<text x="550" y="1353" text-anchor="middle" fill="#86efac" font-size="11">→  continues as Flow 1  (full deposit)  or Flow 2  (partial again)</text>

<!-- ================================================================ -->
<!-- FLOW 4 — Overpayment refund                                       -->
<!-- ================================================================ -->
<rect x="0" y="1375" width="1100" height="30" fill="#2d1f0e"/>
<text x="550" y="1395" text-anchor="middle" fill="#fb923c" font-size="13" font-weight="bold">FLOW 4 — Overpayment refund  (triggered when refundableAmount &gt; 0)</text>

<!-- trigger note -->
<rect x="200" y="1415" width="700" height="24" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="550" y="1431" text-anchor="middle" fill="#94a3b8" font-size="10.5">HubPay detects  refundableAmount &gt; 0  in  DEPOSIT_FULL_AMOUNT_COMPLETED  webhook or  GET /paymentStatus</text>

<!-- HubPay → HexTrust: standard withdrawal API -->
<text x="461" y="1469" text-anchor="middle" fill="#94a3b8" font-size="11">standard withdrawal API  (destination_address · amount)</text>
<text x="461" y="1482" text-anchor="middle" fill="#94a3b8" font-size="10">(no dedicated /refund endpoint at launch)</text>
<line x1="328" y1="1493" x2="585" y2="1493" stroke="#fb923c" stroke-width="2" marker-end="url(#ao)"/>

<!-- HubPay → Payer -->
<text x="218" y="1521" text-anchor="middle" fill="#94a3b8" font-size="11">refund of X crypto sent to your address</text>
<line x1="328" y1="1532" x2="116" y2="1532" stroke="#fb923c" stroke-width="2" marker-end="url(#ao)"/>

<!-- ================================================================ -->
<!-- LEGEND                                                            -->
<!-- ================================================================ -->
<rect x="5" y="1558" width="1090" height="58" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="20" y="1577" fill="#94a3b8" font-size="11" font-weight="bold">Webhook events (⚡ purple dashed):</text>
<text x="20" y="1595" fill="#c4b5fd" font-size="10.5">DEPOSIT_PARTIAL_AMOUNT  ·  DEPOSIT_FULL_AMOUNT_COMPLETED  ·  PAYMENT_EXECUTED  ·  QUOTE_EXPIRED  ·  SETTLED_FULL_AMOUNT  ·  SETTLED_PARTIAL_AMOUNT</text>
<line x1="730" y1="1575" x2="760" y2="1575" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#awh)"/>
<text x="765" y="1578" fill="#c4b5fd" font-size="10.5">push webhook</text>
<line x1="870" y1="1575" x2="900" y2="1575" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>
<text x="905" y="1578" fill="#94a3b8" font-size="10.5">API / chain</text>

</svg>
</body>
</html>
