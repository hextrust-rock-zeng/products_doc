<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
body{background:#0f172a;margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
h1{text-align:center;color:#7dd3fc;font-size:18px;margin:0 0 4px;font-weight:600}
p.sub{text-align:center;color:#64748b;font-size:12px;margin:0 0 12px}
</style>
</head>
<body>
<h1>Convert-to-Pay — Payment Order State Machine</h1>
<p class="sub">Full lifecycle · partial payments · overpayment · new-quote loop · refunds</p>
<svg viewBox="0 0 1100 900" style="width:100%;display:block;max-width:1100px;margin:0 auto;overflow:visible">
<defs>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker>
</defs>

<!-- START -->
<circle cx="490" cy="16" r="9" fill="#60a5fa"/>
<path d="M490,25 L490,32" stroke="#60a5fa" stroke-width="2" marker-end="url(#ab)"/>

<!-- QUOTE_ACCEPTED -->
<rect x="360" y="32" width="260" height="46" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
<text x="490" y="60" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="bold">QUOTE_ACCEPTED</text>

<!-- PARTIAL_DEPOSIT_RECEIVED -->
<rect x="15" y="180" width="240" height="55" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
<text x="135" y="203" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">PARTIAL_DEPOSIT</text>
<text x="135" y="221" text-anchor="middle" fill="#93c5fd" font-size="12">_RECEIVED</text>

<!-- QUOTE_EXPIRED_NO_DEPOSIT (terminal) -->
<rect x="760" y="180" width="250" height="55" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="2"/>
<text x="885" y="203" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">QUOTE_EXPIRED</text>
<text x="885" y="221" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">_NO_DEPOSIT  ✗</text>

<!-- HEDGE_EXECUTING -->
<rect x="368" y="335" width="244" height="46" rx="8" fill="#431407" stroke="#ea580c" stroke-width="2"/>
<text x="490" y="363" text-anchor="middle" fill="#fdba74" font-size="14" font-weight="bold">HEDGE_EXECUTING</text>

<!-- FULLY_SETTLED (terminal) -->
<rect x="15" y="465" width="215" height="46" rx="8" fill="#052e16" stroke="#16a34a" stroke-width="2"/>
<text x="123" y="493" text-anchor="middle" fill="#86efac" font-size="13" font-weight="bold">FULLY_SETTLED  ✓</text>

<!-- PARTIALLY_SETTLED -->
<rect x="750" y="465" width="230" height="46" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
<text x="865" y="493" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">PARTIALLY_SETTLED</text>

<!-- REFUND_PENDING (overpayment only) -->
<rect x="15" y="560" width="215" height="46" rx="8" fill="#431407" stroke="#ea580c" stroke-width="2"/>
<text x="123" y="588" text-anchor="middle" fill="#fdba74" font-size="13" font-weight="bold">REFUND_PENDING</text>


<!-- ===== TRANSITIONS ===== -->

<!-- QUOTE_ACCEPTED → PARTIAL_DEPOSIT_RECEIVED -->
<path d="M430,78 Q285,130 135,180" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="248" y="117" text-anchor="middle" fill="#94a3b8" font-size="11">partial deposit received,</text>
<text x="248" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">cumulative &lt; full (within window)</text>

<!-- QUOTE_ACCEPTED → QUOTE_EXPIRED_NO_DEPOSIT -->
<path d="M553,78 Q715,130 885,180" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="745" y="117" text-anchor="middle" fill="#94a3b8" font-size="11">expiry+buffer,</text>
<text x="745" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">no deposits</text>


<!-- PARTIAL_DEPOSIT_RECEIVED self-loop -->
<path d="M80,180 C80,150 195,150 195,180" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="138" y="143" text-anchor="middle" fill="#94a3b8" font-size="10">more deposits (×n)</text>

<!-- PARTIAL_DEPOSIT_RECEIVED → HEDGE_EXECUTING -->
<path d="M255,207 Q330,265 400,335" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#ao)"/>
<text x="300" y="258" text-anchor="middle" fill="#94a3b8" font-size="10">cumulative = full (→ immediate)</text>
<text x="300" y="271" text-anchor="middle" fill="#94a3b8" font-size="10">OR expiry+buffer (→ partial hedge)</text>

<!-- HEDGE_EXECUTING → FULLY_SETTLED -->
<path d="M403,381 Q265,423 123,465" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="237" y="432" text-anchor="middle" fill="#94a3b8" font-size="10">full amount hedged at original rate</text>
<text x="237" y="445" text-anchor="middle" fill="#86efac" font-size="10" font-style="italic">⟶ PAYMENT_EXECUTED</text>

<!-- HEDGE_EXECUTING → PARTIALLY_SETTLED -->
<path d="M577,381 Q715,423 865,465" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="745" y="428" text-anchor="middle" fill="#94a3b8" font-size="10">partial amount hedged at original rate</text>
<text x="745" y="441" text-anchor="middle" fill="#86efac" font-size="10" font-style="italic">⟶ PARTIAL_PAYMENT_EXECUTED</text>

<!-- FULLY_SETTLED → REFUND_PENDING (dashed, conditional) -->
<path d="M123,511 L123,560" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ao)"/>
<text x="148" y="535" fill="#94a3b8" font-size="10">if overpayment</text>
<text x="148" y="548" fill="#86efac" font-size="10" font-style="italic">⟶ REFUND_AVAILABLE</text>

<!-- PARTIALLY_SETTLED → QUOTE_ACCEPTED (new quote loop, right side) -->
<path d="M980,488 C1065,488 1065,55 620,55" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ag)"/>
<text transform="rotate(-90,1078,310)" x="1078" y="310" text-anchor="middle" fill="#86efac" font-size="10">client requests new quote · same client_order_id · address reused</text>

<!-- ===== LEGEND ===== -->
<rect x="15" y="820" width="680" height="62" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="28" y="838" fill="#94a3b8" font-size="11" font-weight="bold">Legend</text>
<line x1="80" y1="836" x2="112" y2="836" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
<text x="117" y="839" fill="#94a3b8" font-size="11">State transition</text>
<line x1="225" y1="836" x2="257" y2="836" stroke="#ea580c" stroke-width="2" marker-end="url(#ao)"/>
<text x="262" y="839" fill="#94a3b8" font-size="11">Hedge / refund</text>
<line x1="368" y1="836" x2="400" y2="836" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
<text x="405" y="839" fill="#94a3b8" font-size="11">Success terminal</text>
<line x1="515" y1="836" x2="547" y2="836" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
<text x="552" y="839" fill="#94a3b8" font-size="11">Failure</text>
<line x1="80" y1="860" x2="112" y2="860" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ao)"/>
<text x="117" y="863" fill="#94a3b8" font-size="11">Conditional path</text>
<line x1="240" y1="860" x2="272" y2="860" stroke="#34d399" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ag)"/>
<text x="277" y="863" fill="#94a3b8" font-size="11">Loop-back (new quote, same address)</text>
<text x="490" y="863" fill="#86efac" font-size="10" font-style="italic">  Italic = webhook event fired</text>
</svg>
</body>
</html>
